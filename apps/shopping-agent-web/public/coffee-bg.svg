<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Base background gradient: Deep roast espresso to warm dark mocha -->
    <radialGradient id="ambient-glow" cx="28%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#463426" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#2c1f17" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#18110d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0e0a07" stop-opacity="1"/>
    </radialGradient>

    <!-- Warm pendant / cafe bar spotlight glow -->
    <radialGradient id="pendant-lamp" cx="22%" cy="14%" r="42%">
      <stop offset="0%" stop-color="#dfa868" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#b67a42" stop-opacity="0.25"/>
      <stop offset="65%" stop-color="#5a381e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#18110d" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm counter reflection / wood bar highlight -->
    <linearGradient id="counter-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3525" stop-opacity="0.6"/>
      <stop offset="8%" stop-color="#2d1f16" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#1c130d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d0906" stop-opacity="1"/>
    </linearGradient>

    <!-- Bar rim light -->
    <linearGradient id="bar-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9955c" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#dfa868" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#8c5d33" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2d1f16" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Secondary warm atmospheric bokeh -->
    <radialGradient id="bokeh-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8be88" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#aa723e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#18110d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bokeh-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4904f" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#643b1c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#18110d" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="medium-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Deep canvas base -->
  <rect width="1920" height="1080" fill="#120c09"/>
  <rect width="1920" height="1080" fill="url(#ambient-glow)"/>

  <!-- Warm Cafe ambient lighting & bokeh circles (softly blurred) -->
  <g filter="url(#soft-blur)">
    <circle cx="420" cy="180" r="320" fill="url(#pendant-lamp)"/>
    <circle cx="260" cy="420" r="180" fill="url(#bokeh-1)"/>
    <circle cx="780" cy="310" r="240" fill="url(#bokeh-2)"/>
    <circle cx="1600" cy="220" r="300" fill="url(#bokeh-2)" opacity="0.6"/>
    <circle cx="1320" cy="520" r="220" fill="url(#bokeh-1)" opacity="0.4"/>
  </g>

  <!-- Cafe Counter Silhouette (warm dark wood perspective) -->
  <path d="M 0,720 L 1920,660 L 1920,1080 L 0,1080 Z" fill="url(#counter-gradient)"/>
  <!-- Polished wood rim highlight line -->
  <path d="M 0,720 L 1920,660" stroke="url(#bar-rim)" stroke-width="2.5" opacity="0.85"/>

  <!-- Warm counter reflection glow -->
  <ellipse cx="480" cy="740" rx="420" ry="60" fill="#9e6939" opacity="0.15" filter="url(#medium-blur)"/>

  <!-- Soft vignette around entire perimeter -->
  <rect width="1920" height="1080" fill="none" stroke="#000000" stroke-width="80" opacity="0.35"/>
</svg>
